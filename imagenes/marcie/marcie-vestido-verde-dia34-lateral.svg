    <rect x="690" y="642" width="110" height="52" fill="url(#flores)"/>
    <text x="690" y="712" font-weight="bold">Verde de flores</text><text x="690" y="726">vestido</text>
    <rect x="818" y="642" width="110" height="52" fill="#1f7a45"/>
    <text x="818" y="712" font-weight="bold">Verde vivo</text><text x="818" y="726">capuchas y pendientes</text>
    <rect x="946" y="642" width="110" height="52" fill="#111"/>
    <text x="946" y="712" font-weight="bold">Negro</text><text x="946" y="726">pezoneras, correas</text>
    <rect x="1074" y="642" width="110" height="52" fill="url(#metal)"/>
    <text x="1074" y="712" font-weight="bold">Acero</text><text x="1074" y="726">férula y muletas</text>
  </g>
