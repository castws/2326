  <path d="M362 598 Q358 588 358 578" fill="none" stroke="#1b1b1d" stroke-width="3" stroke-linecap="round"/>

  <!-- vestido de perfil -->
  <path id="vest" d="M300 290 Q268 316 262 360 Q260 410 270 450 Q278 470 280 480 Q256 520 252 570 Q250 620 268 652 Q274 680 276 705 L356 705 Q352 650 360 592 Q364 560 362 540 Q356 515 358 500 Q354 480 352 460 Q352 432 358 410 L356 336 Q352 314 348 300 Q326 304 300 290 Z" fill="url(#flores)" stroke="#1d4f35" stroke-width="1.4" stroke-linejoin="round"/>
