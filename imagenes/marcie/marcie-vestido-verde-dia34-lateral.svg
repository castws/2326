      <stop offset="0" stop-color="#e0bba3"/>
      <stop offset="0.6" stop-color="#f2d8c6"/>
      <stop offset="1" stop-color="#e6c3ac"/>
    </linearGradient>
    <pattern id="flores" width="34" height="34" patternUnits="userSpaceOnUse">
