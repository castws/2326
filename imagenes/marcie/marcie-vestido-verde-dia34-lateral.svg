  <!-- ===================== LLAMADAS ===================== -->
  <g font-size="12.5" fill="#3d3a36">
    <g stroke="#9c948a" stroke-width="0.9" fill="none">
      <polyline points="268,330 246,246 240,246"/>
      <polyline points="397,372 470,340 486,340"/>
      <polyline points="358,406 470,430 486,430"/>
