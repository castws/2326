    <g text-anchor="end">
      <text x="236" y="233" font-weight="bold">Pelo por la espalda</text>
      <text x="236" y="249">hasta media espalda</text>
      <text x="236" y="553" font-weight="bold">Vestido entallado</text>
      <text x="236" y="569">marca cintura y cadera;</text>
      <text x="236" y="583">bajo a medio muslo</text>
      <text x="236" y="693" font-weight="bold">Muleta canadiense</text>
      <text x="236" y="709">el apoyo cae por</text>
      <text x="236" y="723">delante de los pies</text>
    </g>

    <text x="492" y="337" font-weight="bold">Seno de perfil</text>
    <text x="492" y="353">copa D, sale entero por</text>
    <text x="492" y="367">la abertura; pezonera de</text>
    <text x="492" y="381">canto y pendiente colgando</text>

    <text x="492" y="427" font-weight="bold">Ribete de la abertura</text>
    <text x="492" y="443">abraza la base del seno</text>

    <text x="492" y="593" font-weight="bold">Férula a 90°</text>
    <text x="492" y="609">sobresale por delante del</text>
    <text x="492" y="623">vestido; capucha verde en</text>
    <text x="492" y="637">la punta</text>

    <text x="492" y="697" font-weight="bold">Capucha de testículos</text>
    <text x="492" y="713">cuelga bajo el anillo</text>

    <text x="492" y="787" font-weight="bold">Botones de abajo sueltos</text>
    <text x="492" y="803">el delantero se abre desde</text>
    <text x="492" y="817">el pubis hasta el bajo</text>

    <text x="492" y="997" font-weight="bold">Piernas desnudas</text>
    <text x="492" y="1013">sin vello, sin medias</text>

    <text x="492" y="1177" font-weight="bold">Bailarinas planas</text>
    <text x="492" y="1193">color crudo</text>
  </g>

  <!-- ===================== COLUMNA DERECHA ===================== -->
  <g fill="#2e2b28">
    <text x="690" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="4">MARCIE</text>
    <text x="690" y="122" font-size="13" letter-spacing="1.2" fill="#6d665d">VISTA LATERAL · DÍA 34, 9:45 · CAMINO DEL CRESTON</text>
    <text x="690" y="144" font-size="13" fill="#8a8277">Complemento de marcie-vestido-verde-dia34.svg (vista frontal)</text>
  </g>
