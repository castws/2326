  <g font-size="11" fill="#4d4841">
    <g text-anchor="end">
      <text x="734" y="268">arnés</text><text x="734" y="281">a la cintura</text>
      <text x="734" y="324">anillo</text><text x="734" y="337">de base</text>
    </g>
    <text x="1034" y="289">pletina dorsal</text>
    <text x="1034" y="316">capucha verde (glande)</text>
    <text x="1034" y="344">cuna de soporte</text>
    <text x="1034" y="372">dos correas de velcro</text>
    <text x="1034" y="400">capucha de testículos</text>
  </g>
  <g font-size="11.5" fill="#4d4841">
    <text x="690" y="520">De frente la férula se ve de cara; de lado se lee entera. El conjunto</text>
    <text x="690" y="538">sostiene el pene a 90° y es rígido: por eso el vestido no cierra del</text>
    <text x="690" y="556">pubis para abajo. Pieza única post-quirúrgica; se retira esta noche.</text>
  </g>

  <!-- paleta -->
  <line x1="690" y1="600" x2="1190" y2="600" stroke="#e0d9cc" stroke-width="1"/>
  <text x="690" y="628" font-size="12" letter-spacing="2" fill="#8a8277">PALETA</text>
