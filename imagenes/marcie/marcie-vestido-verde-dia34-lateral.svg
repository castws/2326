      <g fill="#ffffff">
        <circle cx="8" cy="5" r="2.2"/><circle cx="12" cy="8" r="2.2"/><circle cx="10.5" cy="12.5" r="2.2"/><circle cx="5.5" cy="12.5" r="2.2"/><circle cx="4" cy="8" r="2.2"/>
      </g>
      <circle cx="8" cy="9" r="1.4" fill="#e8d36a"/>
