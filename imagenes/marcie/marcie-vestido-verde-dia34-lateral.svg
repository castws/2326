        <circle cx="25" cy="22" r="1.6"/><circle cx="28" cy="24.5" r="1.6"/><circle cx="27" cy="28" r="1.6"/><circle cx="23" cy="28" r="1.6"/><circle cx="22" cy="24.5" r="1.6"/>
