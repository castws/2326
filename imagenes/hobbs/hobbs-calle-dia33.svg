    <text x="690" y="122" font-size="13" letter-spacing="1.2" fill="#6d665d">LOOK DE CALLE · SALIDA DEL CRESTON, DÍA 33, 15:10</text>
    <text x="690" y="144" font-size="13" fill="#8a8277">Residente de primer año · 158 cm, menuda, caderas anchas · pecas</text>
