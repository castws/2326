  <text x="690" y="880" font-size="11.5" fill="#4d4841">Combinación fijada por Marcie el Día 30: <tspan font-weight="bold">cuerina con C-string</tspan>.</text>
  <text x="690" y="898" font-size="11.5" fill="#4d4841">Los colgantes azules van a juego con la joya del plug.</text>

