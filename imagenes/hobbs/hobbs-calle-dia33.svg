    <text x="492" y="117" font-weight="bold">Pinza lateral</text>
    <text x="492" y="133">recoge el pelo a un lado;</text>
    <text x="492" y="147">se le suelta a menudo</text>

    <text x="492" y="259" font-weight="bold">Top negro</text>
    <text x="492" y="275">cubre solo brazos,</text>
    <text x="492" y="289">hombros y clavículas</text>

    <text x="492" y="377" font-weight="bold">Manga larga</text>
    <text x="492" y="393">ceñida, hasta la muñeca</text>

    <text x="492" y="467" font-weight="bold">Pezoneras negras</text>
    <text x="492" y="483">con colgantes azules; senos</text>
    <text x="492" y="497">fuera, vueltas a pegar</text>

    <text x="492" y="567" font-weight="bold">Falda de cuerina</text>
    <text x="492" y="583">negra, talle alto,</text>
    <text x="492" y="597">a medio muslo</text>

    <text x="492" y="687" font-weight="bold">Abertura en V</text>
    <text x="492" y="703">C-string de encaje negro;</text>
    <text x="492" y="717">se leen las barras de la</text>
    <text x="492" y="731">jaula bajo el encaje</text>

    <text x="492" y="897" font-weight="bold">Piernas desnudas</text>
    <text x="492" y="913">sin medias, piel muy pálida</text>

    <text x="492" y="1177" font-weight="bold">Zapatillas</text>
    <text x="492" y="1193">blancas, cierre de velcro</text>
  </g>

