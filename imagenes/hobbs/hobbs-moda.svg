    <path d="M450 252 Q449 264 446 268 Q450 271 455 268" fill="none" stroke="#c09a85" stroke-width="1.2" filter="url(#ink)"/>
    <path d="M440 284 Q446 280 450 282 Q455 280 460 284 Q455 287 450 287 Q445 287 440 284 Z" fill="#d98f8a"/>
    <path d="M440 284 Q450 290 460 284" fill="none" stroke="#b76b67" stroke-width="0.9"/>
