    <path d="M420 196 Q446 184 480 190 M404 230 Q410 206 428 194 M494 236 Q492 212 478 198" fill="none" stroke="#c7a676" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- mechón suelto que se escapa de la pinza -->
    <path d="M418 214 Q408 244 416 276" fill="none" stroke="#8a6c43" stroke-width="3.2" stroke-linecap="round" filter="url(#ink)"/>
    <!-- pinza azul -->
    <rect x="404" y="212" width="20" height="8" rx="3.5" fill="#2f6fd6" stroke="#1d4d9e" stroke-width="0.9" transform="rotate(-58 414 216)"/>
  </g>

  <!-- nota a lápiz -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#8a8277" font-size="15">
    <text x="226" y="820" transform="rotate(-6 226 820)">se tira de la falda</text>
    <text x="238" y="840" transform="rotate(-6 238 840)">sin darse cuenta</text>
  </g>
  <path d="M340 812 Q360 796 372 776" fill="none" stroke="#8a8277" stroke-width="1" filter="url(#ink)"/>
  <path d="M372 776 L364 780 M372 776 L372 785" fill="none" stroke="#8a8277" stroke-width="1"/>

  </g>

