  <path d="M526 364 Q548 420 552 470 Q552 510 538 530 L400 560 M394 536 L520 498 Q524 470 510 410" fill="none" stroke="#050505" stroke-width="1.5" stroke-linecap="round" filter="url(#ink)"/>
  <path d="M402 530 Q380 526 368 540 Q364 556 378 566 Q394 570 404 560 Z" fill="url(#skinG)" filter="url(#wash)"/>
  <path d="M402 530 Q380 526 368 540 Q364 556 378 566 Q394 570 404 560 M372 548 L392 546" fill="none" stroke="#7a5647" stroke-width="1.3" filter="url(#ink)"/>
  <path d="M362 470 Q360 560 370 660 M540 430 Q546 460 544 490" fill="none" stroke="#5a5a64" stroke-width="2" opacity="0.6"/>
  <!-- cuerpo del top: hombros y clavículas -->
  <path d="M432 332 Q400 334 376 348 Q362 360 360 380 Q380 392 396 400 Q424 388 450 386 Q476 388 504 400 Q520 392 540 380 Q538 360 524 348 Q500 334 468 332 Q450 344 432 332 Z" fill="#1d1d21" filter="url(#ink)"/>
  <path d="M432 332 Q400 334 376 348 Q362 360 360 380 M540 380 Q538 360 524 348 Q500 334 468 332 M396 400 Q424 388 450 386 Q476 388 504 400 M432 332 Q450 344 468 332" fill="none" stroke="#050505" stroke-width="1.5" stroke-linecap="round" filter="url(#ink)"/>
  <path d="M388 360 Q420 350 450 352 Q480 350 512 360" fill="none" stroke="#4a4a52" stroke-width="1.2" opacity="0.8"/>

  <!-- ===================== CABEZA ===================== -->
  <g transform="rotate(7 450 250)">
    <path d="M408 244 Q408 196 450 194 Q492 196 492 244 Q492 280 478 296 Q466 308 450 308 Q434 308 422 296 Q408 280 408 244 Z" fill="url(#skinG)" filter="url(#wash)"/>
    <path d="M410 256 Q412 282 422 296 Q434 308 450 308 Q466 308 478 296 Q490 282 491 258" fill="none" stroke="#7a5647" stroke-width="1.5" stroke-linecap="round" filter="url(#ink)"/>
    <!-- rubor que se le enciende -->
    <ellipse cx="424" cy="272" rx="14" ry="8" fill="#f09a90" opacity="0.5" filter="url(#wash)"/>
    <ellipse cx="478" cy="272" rx="14" ry="8" fill="#f09a90" opacity="0.5" filter="url(#wash)"/>
    <!-- pecas -->
    <g fill="#c98f6f" opacity="0.9">
      <circle cx="438" cy="262" r="1"/><circle cx="444" cy="258" r="0.9"/><circle cx="456" cy="258" r="0.9"/><circle cx="462" cy="262" r="1"/>
      <circle cx="418" cy="264" r="1"/><circle cx="424" cy="268" r="0.9"/><circle cx="430" cy="262" r="0.9"/><circle cx="420" cy="274" r="0.9"/>
      <circle cx="482" cy="264" r="1"/><circle cx="476" cy="268" r="0.9"/><circle cx="470" cy="262" r="0.9"/><circle cx="484" cy="274" r="0.9"/>
    </g>
    <!-- cejas algo levantadas, inseguras -->
    <path d="M424 230 Q432 224 442 228 M458 228 Q468 224 476 230" fill="none" stroke="#8d6a45" stroke-width="2.2" stroke-linecap="round"/>
    <!-- ojos azules grandes, mirada de lado -->
    <path d="M422 244 Q432 235 443 244 Q432 250 422 244 Z M457 244 Q468 235 478 244 Q468 250 457 244 Z" fill="#fbf8f4" stroke="#3a2c24" stroke-width="1.2"/>
    <circle cx="437" cy="243.5" r="4.4" fill="#4b7fb3"/><circle cx="472" cy="243.5" r="4.4" fill="#4b7fb3"/>
    <circle cx="437.5" cy="243.5" r="1.9" fill="#15202b"/><circle cx="472.5" cy="243.5" r="1.9" fill="#15202b"/>
    <circle cx="438.8" cy="242" r="1.1" fill="#fff"/><circle cx="473.8" cy="242" r="1.1" fill="#fff"/>
    <path d="M422 243 Q432 234 443 243 M457 243 Q468 234 478 243" fill="none" stroke="#3a2c24" stroke-width="1.6"/>
