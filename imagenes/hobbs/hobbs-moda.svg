  <path d="M402 516 L498 516" stroke="#4d4d56" stroke-width="1"/>
  <path d="M400 500 L500 500 Q526 548 534 610 Q540 680 542 764 L476 764 L450 650 L424 764 L358 764 Q360 680 366 610 Q374 548 400 500 Z" fill="none" stroke="#050505" stroke-width="1.6" stroke-linejoin="round" filter="url(#ink)"/>

  <!-- ===================== BRAZOS Y TOP NEGRO ===================== -->
  <!-- brazo derecho de ella (izq. del dibujo): estirado, tira del bajo de la falda -->
  <path d="M374 364 Q356 440 352 520 Q352 600 364 700 L384 752 L396 744 L384 692 Q378 600 382 520 Q388 450 398 396 Z" fill="#1d1d21" filter="url(#ink)"/>
  <path d="M374 364 Q356 440 352 520 Q352 600 364 700 L384 752 M396 744 L384 692 Q378 600 382 520 Q388 450 398 396" fill="none" stroke="#050505" stroke-width="1.5" stroke-linecap="round" filter="url(#ink)"/>
