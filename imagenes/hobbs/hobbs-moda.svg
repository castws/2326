  <circle cx="420" cy="448" r="5.4" fill="#111"/>
  <line x1="420" y1="453" x2="420" y2="462" stroke="#9aa3ad" stroke-width="0.9"/>
  <path d="M420 461 Q415 467 420 474 Q425 467 420 461 Z" fill="#2f6fd6" stroke="#1d4d9e" stroke-width="0.7"/>
