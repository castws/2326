  <path d="M482 461 Q477 467 482 474 Q487 467 482 461 Z" fill="#2f6fd6" stroke="#1d4d9e" stroke-width="0.7"/>
  <circle cx="418.6" cy="465.5" r="1" fill="#cfe0ff"/><circle cx="480.6" cy="465.5" r="1" fill="#cfe0ff"/>

  <!-- ===================== FALDA DE CUERINA ===================== -->
  <!-- C-string de encaje dentro de la V (debajo de la falda) -->
  <path d="M440 656 Q450 650 460 656 Q463 676 455 692 Q450 697 445 692 Q437 676 440 656 Z" fill="url(#lace)" stroke="#000" stroke-width="0.9"/>
  <path d="M446 658 L446 690 M450 655 L450 694 M454 658 L454 690" stroke="#77777d" stroke-width="0.7" opacity="0.7"/>
  <path d="M400 500 L500 500 Q526 548 534 610 Q540 680 542 764 L476 764 L450 650 L424 764 L358 764 Q360 680 366 610 Q374 548 400 500 Z" fill="url(#leather)"/>
