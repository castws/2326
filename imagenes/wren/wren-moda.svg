  <path d="M412 1346 L468 1348" stroke="#f1f1f1" stroke-width="2.2"/>
  <path d="M498 1250 Q493 1280 505 1302 L534 1304 Q541 1284 530 1250 Z" fill="#1c1c1f" stroke="#050505" stroke-width="1.5" filter="url(#ink)"/>
  <path d="M504 1298 L534 1300" stroke="#f1f1f1" stroke-width="2"/>
