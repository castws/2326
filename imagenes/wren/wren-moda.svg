  <g fill="none" stroke="#8a8277" stroke-width="0.9" stroke-linecap="round" opacity="0.55" filter="url(#ink)">
    <path d="M548 1236 Q560 1250 566 1270"/><path d="M556 1206 Q570 1222 578 1246"/>
    <path d="M536 640 Q548 650 552 664"/><path d="M372 630 Q364 644 364 660"/>
  </g>

  </g>

  <!-- pene colgando por la abertura, con la capucha negra lisa: se balancea con el paso -->
  <g transform="rotate(9 456 646)">
    <rect x="449" y="640" width="13" height="40" rx="3" fill="url(#skinG)" stroke="#b9917d" stroke-width="1" filter="url(#ink)"/>
    <path d="M448 676 L463 676 L463 690 Q463 700 455.5 700 Q448 700 448 690 Z" fill="#111113" stroke="#000" stroke-width="1" filter="url(#ink)"/>
