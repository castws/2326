    <text x="492" y="97" font-weight="bold">Moño deshecho</text>
    <text x="492" y="113">con el bolígrafo clavado</text>

    <text x="492" y="247" font-weight="bold">Camisa blanca</text>
    <text x="492" y="263">cuello abierto; pecas de las</text>
    <text x="492" y="277">clavículas a los senos</text>

    <text x="492" y="327" font-weight="bold">Aberturas redondas</text>
    <text x="492" y="343">los senos salen enteros</text>

    <text x="492" y="407" font-weight="bold">Pezoneras de disco</text>
    <text x="492" y="423">plateado, 2,5 cm: asoma un</text>
    <text x="492" y="437">anillo de areola alrededor</text>

    <text x="492" y="477" font-weight="bold">Mangas remangadas</text>
    <text x="492" y="493">vuelta sobre el codo</text>

    <text x="492" y="587" font-weight="bold">Delantal corto</text>
    <text x="492" y="603">verde oscuro del Hollis</text>

    <text x="492" y="677" font-weight="bold">Falda negra</text>
    <text x="492" y="693">muy corta</text>

    <text x="492" y="767" font-weight="bold">Prenda de capucha</text>
    <text x="492" y="783">cuelga libre por la abertura;</text>
    <text x="492" y="797">capucha negra lisa, tres o</text>
    <text x="492" y="811">cuatro dedos de tronco a la</text>
    <text x="492" y="825">vista; se balancea al andar</text>

    <text x="120" y="697" font-weight="bold">Bloc</text>
    <text x="120" y="713">lo lleva y no</text>
    <text x="120" y="727">apunta nada</text>

    <text x="492" y="1177" font-weight="bold">Zapatillas planas</text>
    <text x="492" y="1193">negras</text>
  </g>

