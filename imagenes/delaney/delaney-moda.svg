    <path d="M432 186 Q434 216 443 235 Q455 250 470 250 Q485 250 499 233 Q510 216 511 190" fill="none" stroke="#5a3e2e" stroke-width="1.6" stroke-linecap="round" filter="url(#ink)"/>
