    <rect x="432" y="156" width="20" height="3.6" rx="1.6" fill="#c5cbd1" stroke="#6f777f" stroke-width="0.6" transform="rotate(-28 442 158)"/>
    <rect x="488" y="154" width="20" height="3.6" rx="1.6" fill="#c5cbd1" stroke="#6f777f" stroke-width="0.6" transform="rotate(28 498 156)"/>
