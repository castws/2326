  <path d="M424 1292 Q412 1320 421 1342 L471 1344 Q480 1322 460 1292 Z" fill="#ffffff" stroke="#3a302b" stroke-width="1.6" filter="url(#ink)"/>
  <path d="M552 1290 Q546 1316 560 1332 Q592 1348 622 1338 Q624 1322 590 1292 Z" fill="#ffffff" stroke="#3a302b" stroke-width="1.6" filter="url(#ink)"/>
