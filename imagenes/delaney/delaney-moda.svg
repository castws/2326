  <!-- contorno de tinta -->
  <path d="M392 598 C384 700 396 820 408 950 C404 1010 396 1070 404 1150 C410 1220 420 1270 428 1296 M454 1296 C452 1240 450 1150 448 1080 C446 1020 446 990 442 950 C446 860 452 760 458 690 C470 770 486 880 496 958 C506 1030 522 1120 540 1200 C548 1250 552 1280 556 1296 M584 1292 C576 1240 566 1160 560 1090 C552 1030 548 990 548 958 C556 850 560 720 548 612" fill="none" stroke="#3a302b" stroke-width="1.7" stroke-linecap="round" filter="url(#ink)"/>

